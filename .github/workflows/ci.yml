# Continuous Integration (CI) Workflow for kube-tollgate
# Automates linting, race-enabled unit testing, manifest drift verification, container builds, and k3d E2E tests.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run golangci-lint
        run: make lint

  test:
    name: Unit Tests with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Execute unit test suite
        run: make test

  verify-codegen:
    name: Verify Code Generation Drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Regenerate DeepCopy and CRD manifests
        run: make generate manifests

      - name: Verify clean working tree (no uncommitted drift)
        run: |
          git diff --exit-code || (echo "ERROR: Generated manifests or DeepCopy code are out of sync. Run 'make generate manifests' and commit the changes." && exit 1)

  docker-build:
    name: Build Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        run: docker build -t kube-tollgate:ci .

  e2e:
    name: End-to-End Tests (k3d)
    runs-on: ubuntu-latest
    needs: [lint, test, verify-codegen]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install k3d CLI
        run: wget -q -O - https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Provision k3d cluster and deploy kube-tollgate
        run: ./hack/local-dev.sh

      - name: Run E2E Admission Scenarios
        run: make test-e2e
