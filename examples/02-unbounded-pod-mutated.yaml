# Scenario 02: Unbounded Pod missing resource requests/limits and required labels
# Mutating webhook injects:
# - Labels: cost-center from Namespace label, team from Namespace annotation, environment from policy default
# - Resources: default requests (100m CPU, 128Mi RAM) and limits (400m CPU, 256Mi RAM)
apiVersion: v1
kind: Pod
metadata:
  name: unbounded-worker-mutated
  namespace: team-billing
spec:
  containers:
    - name: worker
      image: alpine:3.20
      command: ["sleep", "3600"]
