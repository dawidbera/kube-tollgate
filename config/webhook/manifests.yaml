# MutatingWebhookConfiguration intercepting Pod creation and updates
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kube-tollgate-mutating-webhook-configuration
webhooks:
  - name: mutate.finops.tollgate.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
        scope: Namespaced
    clientConfig:
      service:
        name: tollgate-webhook-service
        namespace: tollgate-system
        path: /mutate
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - tollgate-system
---
# ValidatingWebhookConfiguration intercepting Pod creation and updates
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kube-tollgate-validating-webhook-configuration
webhooks:
  - name: validate.finops.tollgate.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
        scope: Namespaced
    clientConfig:
      service:
        name: tollgate-webhook-service
        namespace: tollgate-system
        path: /validate
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - tollgate-system
