# ClusterRoleBinding associating the manager role with the tollgate service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tollgate-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tollgate-manager-role
subjects:
  - kind: ServiceAccount
    name: tollgate-controller-manager
    namespace: tollgate-system
